name: CI

# Bors-like CI batching via GitHub's native merge queue.
#
# See README.md for full design documentation. Summary:
#
#   tier-0  validate (cheap)      — every PR, every queue entry
#   tier-1  build matrix          — ci/tier-1 label, ci/merge label, merge queue tip
#   tier-2  test-integration      — merge queue tip only (or forced)
#
# Non-tip queue entries run tier-0 only, then wait for the tip to pass the
# full suite under ALLGREEN before anything merges.
#
# REQUIREMENT: merge queue must use ALLGREEN grouping, not HEADMERGE.

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Detects queue position and sets build_os_matrix / integration_os_matrix.
  # An empty matrix ("[]") causes the downstream job to be skipped, which counts
  # as passing for required-checks purposes.
  #
  # Decision table:
  #   merge_group + tip of queue:    tier-2  (full suite)
  #   merge_group + not tip:         tier-0  (cheap only — wait for tip)
  #   merge_group + API failure:     tier-2  (fail-safe: assume tip)
  #   workflow_dispatch / ci/merge:  tier-2
  #   PR with ci/tier-1 label:       tier-1  (build matrix, no integration)
  #   plain PR:                      tier-0
  #
  # See .github/scripts/compute-ci-level.mjs for the GraphQL tip-detection logic.
  compute-ci-level:
    runs-on: ubuntu-latest
    outputs:
      ci_level: ${{ steps.matrix.outputs.ci_level }}
      build_os_matrix: ${{ steps.matrix.outputs.build_os_matrix }}
      integration_os_matrix: ${{ steps.matrix.outputs.integration_os_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute CI level
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_BASE_REF: ${{ github.event.merge_group.base_ref || 'refs/heads/main' }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/compute-ci-level.mjs

  # ── Tier-0: cheap checks, always run ──────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fmt check
        # Sandbox: touch ci/fail-validate to simulate a tier-0 failure.
        run: |
          if [ -f ci/fail-validate ]; then
            echo "Simulated validate failure (ci/fail-validate present)"; exit 1
          fi
          echo "fmt check passed"

  # ── Tier-1: build matrix ───────────────────────────────────────────────────
  # Skipped when build_os_matrix is empty (plain PR, non-tip queue entry).
  build:
    if: needs.compute-ci-level.outputs.build_os_matrix != '[]'
    needs: compute-ci-level
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.compute-ci-level.outputs.build_os_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        # Sandbox: touch ci/fail-build to simulate a tier-1 failure.
        run: |
          if [ -f ci/fail-build ]; then
            echo "Simulated build failure (ci/fail-build present)"; exit 1
          fi
          echo "build on ${{ matrix.os }} passed"

  # ── Tier-2: integration matrix ─────────────────────────────────────────────
  # Only runs when integration_os_matrix is non-empty (merge queue tip or forced).
  test-integration:
    if: needs.compute-ci-level.outputs.integration_os_matrix != '[]'
    needs: [compute-ci-level, build]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.compute-ci-level.outputs.integration_os_matrix) }}
        build_type: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: integration test
        # Sandbox: touch ci/fail-integration to simulate a tier-2 failure.
        run: |
          if [ -f ci/fail-integration ]; then
            echo "Simulated integration failure (ci/fail-integration present)"; exit 1
          fi
          echo "integration test (${{ matrix.build_type }}) on ${{ matrix.os }} passed"

  # ── Sentinels ─────────────────────────────────────────────────────────────
  #
  # See README.md "The sentinel jobs" section for full design rationale.
  # Short version: two sentinels let a PR enter the merge queue even if a
  # ci/merge-triggered heavy job flaked, while still blocking actual merges
  # if the full suite fails in the merge queue.
  #
  # required-checks-merge: runs in merge_group/workflow_dispatch only.
  #   - Gates the full suite (all tiers).
  #   - Skipped on pull_request → result is "skipped".
  #   - Uses always() so it runs even when upstream jobs failed, ensuring
  #     the failure is reported rather than the job being skipped.
  #
  required-checks-merge:
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') }}
    needs: [compute-ci-level, validate, build, test-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          FAILED=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success","skipped") | not) | .key')
          if [ -n "$FAILED" ]; then
            echo "The following jobs did not succeed: $FAILED"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."

  # required-checks: configure THIS name as the required status check in repo settings.
  #   - On PRs: required-checks-merge is "skipped" (counts as success), so only
  #     validate gates the PR. Heavy jobs from ci/merge label don't block queue entry.
  #   - In merge queue: required-checks-merge has already run above and will have
  #     failed if anything was broken, so required-checks picks that up.
  #
  required-checks:
    if: always()
    needs: [compute-ci-level, validate, required-checks-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          FAILED=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success","skipped") | not) | .key')
          if [ -n "$FAILED" ]; then
            echo "The following jobs did not succeed: $FAILED"
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
